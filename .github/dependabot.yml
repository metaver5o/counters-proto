version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: staging
    labels: ["SKRYBIT", "dependencies"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: staging
    labels: ["SKRYBIT", "dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: staging
    labels: ["SKRYBIT", "dependencies"]
