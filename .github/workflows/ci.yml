name: CI

on:
  push:
    branches: [main, staging, "feature/**", "feat/**", "cripto/**"]
  pull_request:
    branches: [main, staging]

jobs:
  frontend:
    name: Frontend — type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app/web/ exists
        id: web_check
        run: |
          if [ -f app/web/package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No app/web/package.json found, skipping frontend build"
          fi

      - uses: actions/setup-node@v4
        if: steps.web_check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - run: npm ci
        if: steps.web_check.outputs.exists == 'true'
        working-directory: app/web

      - run: npm run check
        if: steps.web_check.outputs.exists == 'true'
        working-directory: app/web

      - run: npm run build
        if: steps.web_check.outputs.exists == 'true'
        working-directory: app/web

      - uses: actions/upload-artifact@v4
        if: steps.web_check.outputs.exists == 'true'
        with:
          name: static-${{ github.sha }}
          path: app/counters_proto/server/static/
          retention-days: 7

  python:
    name: Python — pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e app/ pytest
      - run: python -m pytest app/tests/ -v --tb=short

  python-lint:
    name: Python — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/counters_proto/
